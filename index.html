<div class="app">

</div>

let state={
  name:"",mode:"",subject:"",questions:[],index:0,score:0,start:0,timer:null,
  answered:false,lastSubject:"",roomCode:"",players:[],roomHost:false
};

const $=id=>document.getElementById(id);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
function toast(msg){
  $("toast").textContent=msg;$("toast").classList.add("show");
  setTimeout(()=>$("toast").classList.remove("show"),1800);
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function makeQuestions(key){
  return shuffle(questionBank[key]).slice(0,10);
}
function startTimer(){
  clearInterval(state.timer);
  state.start=performance.now();
  state.timer=setInterval(()=>{
    const sec=(performance.now()-state.start)/1000;
    $("timer").textContent=formatTime(sec);
  },100);
}
function stopTimer(){clearInterval(state.timer);state.timer=null}
function formatTime(sec){
  const m=Math.floor(sec/60),s=Math.floor(sec%60),d=Math.floor((sec%1)*10);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;
}

$("startBtn").addEventListener("click",()=>{
  const n=$("name").value.trim();
  if(!n){toast("ユーザーネームを入力してください");return}
  state.name=n.slice(0,16);
  localStorage.setItem("examQuizName",state.name);
  show("mode");
});
$("name").value=localStorage.getItem("examQuizName")||"";

$("soloBtn").addEventListener("click",()=>{
  $("subjectGrid").innerHTML="";
  Object.entries(subjects).forEach(([key,s])=>{
    const b=document.createElement("button");b.className="subject";
    b.innerHTML="<strong>"+s.icon+"　"+s.name+"</strong><span>10問ランダムで出題</span>";
    b.addEventListener("click",()=>startSolo(key));
    $("subjectGrid").appendChild(b);
  });
  show("subject");
});
$("battleBtn").addEventListener("click",()=>{renderRoomHome();show("room")});

document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.back)));

function startSolo(key){
  state.mode="solo";state.subject=key;state.questions=makeQuestions(key);
  state.index=0;state.score=0;state.lastSubject=subjects[key].name;
  $("quizPlayer").textContent=state.name+" / "+subjects[key].name;
  show("quiz");startTimer();renderQuestion();
}

function renderQuestion(){
  const q=state.questions[state.index];
  state.answered=false;
  $("questionMeta").textContent=(state.mode==="battle"?"対戦":"1人用")+"　｜　"+(state.index+1)+" / 10";
  $("questionText").textContent=q.q;
  $("progress").style.width=((state.index)/10*100)+"%";
  $("feedback").className="feedback";
  $("hint").textContent="ヒント："+q.h;
  $("choices").innerHTML="";
  q.a.forEach((text,i)=>{
    const b=document.createElement("button");b.className="choice";b.textContent=text;
    b.addEventListener("click",()=>answer(i));
    $("choices").appendChild(b);
  });
}
function answer(i){
  if(state.answered)return;
  state.answered=true;
  const q=state.questions[state.index];
  const buttons=[...$("choices").children];
  buttons.forEach((b,n)=>{
    b.disabled=true;
    if(n===q.c)b.classList.add("correct");
    if(n===i && i!==q.c)b.classList.add("wrong");
  });
  const ok=i===q.c;
  if(ok)state.score++;
  $("verdict").textContent=ok?"正解！⭕️":"不正解！❌";
  $("explain").textContent=q.e;
  $("feedback").className="feedback show "+(ok?"good":"bad");
  $("nextBtn").textContent=state.index===9?"結果を見る":"次の問題 →";
  $("progress").style.width=((state.index+1)/10*100)+"%";
}
$("nextBtn").addEventListener("click",()=>{
  if(!state.answered)return;
  if(state.index===9){finishQuiz();return}
  state.index++;renderQuestion();
});

function finishQuiz(){
  stopTimer();
  const elapsed=(performance.now()-state.start)/1000;
  state.elapsed=elapsed;
  $("resultTitle").textContent=state.score===10?"おめでとー！！！🎉":"結果発表";
  $("resultScore").textContent=state.score+" / 10";
  $("resultTime").textContent="タイム　"+formatTime(elapsed);
  $("battleResult").innerHTML="";
  saveRanking();
  renderRanking();
  show("result");
}
function rankingKey(){return "examQuizRanking"}
function saveRanking(){
  if(state.mode!=="solo")return;
  const list=JSON.parse(localStorage.getItem(rankingKey())||"[]");
  list.push({name:state.name,score:state.score,time:state.elapsed,date:Date.now()});
  list.sort((a,b)=>b.score-a.score||a.time-b.time);
  localStorage.setItem(rankingKey(),JSON.stringify(list.slice(0,10)));
}
function renderRanking(){
  const list=JSON.parse(localStorage.getItem(rankingKey())||"[]");
  if(!list.length){$("ranking").innerHTML='<div class="empty">まだランキングがありません</div>';return}
  $("ranking").innerHTML="";
  list.forEach((r,i)=>{
    const row=document.createElement("div");row.className="rank-row"+(r.name===state.name?" me":"");
    const pos=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+"位";
    row.innerHTML="<strong>"+pos+"</strong><span>"+escapeHTML(r.name)+"<br><small>"+r.score+"問正解</small></span><strong>"+formatTime(r.time)+"</strong>";
    $("ranking").appendChild(row);
  });
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
$("retryBtn").addEventListener("click",()=>{
  if(state.mode==="solo")startSolo(state.subject);else startBattleLocal();
});
$("homeBtn").addEventListener("click",()=>show("mode"));

/* -----------------------------
   ルーム機能
   ----------------------------- */
function randomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";
  for(let i=0;i<6;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function renderRoomHome(){
  $("roomArea").innerHTML="";
  state.roomCode="";state.players=[];
}
$("createRoomBtn").addEventListener("click",()=>{
  state.roomCode=randomCode();state.roomHost=true;state.players=[state.name];
  renderRoom();
});
$("joinRoomBtn").addEventListener("click",()=>{
  const area=$("roomArea");
  area.innerHTML='<div class="card"><label class="label">ルームコード</label><input id="joinCode" maxlength="6" placeholder="例：A7K29P" style="text-transform:uppercase"><div class="actions"><button class="btn" id="joinGo">参加する</button></div></div>';
  $("joinGo").addEventListener("click",()=>{
    const code=$("joinCode").value.trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(code)){toast("6桁のルームコードを入力してください");return}
    state.roomCode=code;state.roomHost=false;state.players=[state.name];
    renderRoom();
  });
});
function renderRoom(){
  $("roomArea").innerHTML="";
  const card=document.createElement("div");card.className="card";
  card.innerHTML='<div class="small">ROOM CODE</div><div class="room-code">'+state.roomCode+'</div>'+
    '<div class="notice">友達にこのコードを伝えて参加してもらってください。<br>現在はHTML単体で動くデモ版です。</div>'+
    '<h3>参加者</h3><div class="players" id="players"></div>'+
    '<div class="actions"><button class="btn secondary" id="copyCode">コードをコピー</button><button class="btn" id="roomStart">対戦を開始</button></div>';
  $("roomArea").appendChild(card);
  renderPlayers();
  $("copyCode").addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(state.roomCode);toast("ルームコードをコピーしました")}
    catch(e){toast("コード："+state.roomCode)}
  });
  $("roomStart").addEventListener("click",()=>{
    if(!state.players.length)return;
    startBattleLocal();
  });
}
function renderPlayers(){
  const p=$("players");if(!p)return;p.innerHTML="";
  state.players.forEach((name,i)=>{
    const d=document.createElement("div");d.className="player";
    d.innerHTML="<span>"+escapeHTML(name)+"</span><span>"+(i===0?"ホスト":"参加者")+"</span>";
    p.appendChild(d);
  });
}
function startBattleLocal(){
  /*
    実際のオンライン対戦では、ここをFirebase等から
    「同じ10問・同じ開始時刻」を取得する処理に置き換える。
  */
  state.mode="battle";state.subject="all";
  const pool=Object.entries(questionBank).flatMap(([key,list])=>list.map(q=>({...q,subject:key})));
  state.questions=shuffle(pool).slice(0,10);
  state.index=0;state.score=0;state.lastSubject="5教科ランダム";
  $("quizPlayer").textContent=state.name+" / 対戦・5教科ランダム";
  show("quiz");startTimer();renderBattleQuestion();
}
function renderBattleQuestion(){
  const q=state.questions[state.index];
  state.answered=false;
  $("questionMeta").textContent="対戦　｜　"+subjects[q.subject].name+"　｜　"+(state.index+1)+" / 10";
  $("questionText").textContent=q.q;
  $("progress").style.width=((state.index)/10*100)+"%";
  $("feedback").className="feedback";
  $("hint").textContent="ヒント："+q.h;
  $("choices").innerHTML="";
  q.a.forEach((text,i)=>{
    const b=document.createElement("button");b.className="choice";b.textContent=text;
    b.addEventListener("click",()=>answerBattle(i));
    $("choices").appendChild(b);
  });
}
function answerBattle(i){
  if(state.answered)return;
  state.answered=true;
  const q=state.questions[state.index],buttons=[...$("choices").children],ok=i===q.c;
  buttons.forEach((b,n)=>{
    b.disabled=true;if(n===q.c)b.classList.add("correct");if(n===i&&i!==q.c)b.classList.add("wrong");
  });
  if(ok)state.score++;
  $("verdict").textContent=ok?"正解！⭕️":"不正解！❌";
  $("explain").textContent=q.e;
  $("feedback").className="feedback show "+(ok?"good":"bad");
  $("nextBtn").textContent=state.index===9?"結果を見る":"次の問題 →";
  $("progress").style.width=((state.index+1)/10*100)+"%";
}
function startBattleNext(){
  if(state.index===9){finishBattleLocal();return}
  state.index++;renderBattleQuestion();
}
function finishBattleLocal(){
  stopTimer();
  const elapsed=(performance.now()-state.start)/1000;
  $("resultTitle").textContent=state.score===10?"おめでとー！！！🎉":"対戦結果";
  $("resultScore").textContent=state.score+" / 10";
  $("resultTime").textContent="あなたのタイム　"+formatTime(elapsed);
  $("battleResult").innerHTML='<div class="notice" style="margin-top:15px">デモ版では自分の結果を表示しています。オンライン対戦にすると友達のスコア・タイムもここへ同期できます。</div>';
  show("result");
}
$("nextBtn").removeEventListener("click",()=>{});
$("nextBtn").addEventListener("click",()=>{
  if(state.mode==="battle" && state.answered)startBattleNext();
});

/* 初期状態 */
show("start");
</script>
</body>
</html>
